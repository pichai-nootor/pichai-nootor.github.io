<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en-US' }}">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>{{ site.title | default: site.github.repository_name }}</title>
<style>
html, body {
  margin: 0;
  padding: 0;
}

header.page-header {
  background: #919191 !important;
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  overflow: visible !important;
  color: white !important;
  /* padding-top: 5rem; */
  padding-bottom: 2rem;
  width: 100vw;
  margin: 0;
}

header.page-header::after {
  display: none !important;
}

header.page-header h1,
header.page-header h2,
header.page-header h3 {
  margin: 0.5rem 0;
  line-height: 1.2;
}
</style>


  </head>

  <body>
    <header class="page-header" role="banner" style="text-align:center;">
      <img 
        src="{{ '/assets/profile.jpg' | relative_url }}" 
        alt="Profile photo" 
        style="width:150px; height:150px; object-fit:cover; object-position:center 20%; margin-top:5rem; border-radius:50%; margin-bottom:10px; box-shadow:0 0 8px rgba(0,0,0,0.15);"
      />
      
      <h1 class="project-name">{{ site.title | default: site.github.repository_name }}</h1>
      <h2 class="project-tagline">{{ site.description | default: site.github.project_tagline }}</h2>
      <h3 class="project-tagline">
        Mail: pichainootor@gmail.com | Phone: 095-395-5453
      </h3>
    </header>

    {{ content }}
  </body>
</html>
