<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en-US' }}">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link
  rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
/>
  <title>{{ site.title | default: site.github.repository_name }}</title>

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      background: #f5f5f5; 
    }


    header.page-header {
      background: #dedede !important;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow: visible !important;
      /* padding-top: 5rem; */
      padding-bottom: 2rem;
      width: 100vw;
      margin: 0;
      color: white;
    }

    header.page-header::after {
      display: none !important;
    }


    header.page-header h1 {
      margin: 0.3rem 0;
      line-height: 1.2;
      text-align: center;
      font-size: 2rem;
      color: #252525;
    }

    header.page-header h2 {
      margin: 0.3rem 0;
      line-height: 1.2;
      text-align: center;
      font-size: 1.2rem;
      color: #252525; 
    }

    header.page-header h3 {
      margin: 0.3rem 0;
      line-height: 1.2;
      text-align: center;
      font-size: 1rem;
      font-weight: normal;
      color: #000000; 
    }

    /* responsive สำหรับ mobile */
    @media screen and (max-width: 600px) {
      header.page-header {
        padding-top: 3rem;
        padding-bottom: 1.5rem;
      }

      header.page-header h1 {
        font-size: 1.5rem;
      }

      header.page-header h2 {
        font-size: 1rem;
      }

      header.page-header h3 {
        font-size: 0.9rem;
      }
    }


    .main-content {
      max-width: 900px;
      margin: 2rem auto;
      padding: 0 1rem;
      box-sizing: border-box;
    }

    header.page-header .contact-info {
      color: #00139ce3; 
      font-weight: bold; 
    }


    header.page-header img {
      width: 150px;
      height: 150px;
      object-fit: cover;
      object-position: center 20%;
      border-radius: 50%;
      margin-top: 5rem;
      margin-bottom: 10px;
      box-shadow: 0 0 8px rgba(0, 0, 0, 0.15);
    }

    @media screen and (max-width: 600px) {
      header.page-header img {
        width: 120px;
        height: 120px;
        margin-top: 3rem;
      }
    }


  .project-tagline {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 1.2rem;
    text-align: center;
    font-size: 1.1rem;
    color: #333;
    margin-top: 10px;
  }

  .contact-info {
    margin-left: 0.3rem;
    font-weight: 500;
  }

  .fa-solid {
    color: #555;
  }

  .separator {
    color: #888;
  }

  @media (max-width: 600px) {
    .project-tagline {
      flex-direction: column;
      gap: 0.5rem;
    }
    .separator {
      display: none;
    }
  }
  </style>
</head>

<body>
  <header class="page-header" role="banner" style="text-align:center;">
    <img src="{{ '/assets/profile.jpg' | relative_url }}" alt="Profile photo" />
    <h1 class="project-name">{{ site.title | default: site.github.repository_name }}</h1>
    <h2 class="project-tagline">{{ site.description | default: site.github.project_tagline }}</h2>
   <h3 class="project-tagline">
  <i class="fa-solid fa-envelope"></i>
  <span class="contact-info">pichainootor@gmail.com</span>
  <span class="separator">|</span>
  <i class="fa-solid fa-phone"></i>
  <span class="contact-info">095-395-5453</span>
</h3>

  </header>

  <div class="main-content">
    {{ content }}
  </div>
</body>

</html>
