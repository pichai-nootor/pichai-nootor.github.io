<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en-US' }}">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ site.title | default: site.github.repository_name }}</title>

    /* กำจัด margin/padding ของ html/body */
    html,

      padding: 0;
      background: #f5f5f5; /* พื้นหลังส่วน content */
    }

    header.page-header {
      background: #3e403e !important;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow: visible !important;

      padding-bottom: 2rem;
      width: 100vw;
      margin: 0;
      color: white;
    }

    /* ลบ ::after ของ Cayman */
    header.page-header::after {
      display: none !important;
    }

      color: #ffeb3b; /* tagline สีต่างจาก h1 */
    }
