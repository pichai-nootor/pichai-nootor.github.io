<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en-US' }}">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>{{ site.title | default: site.github.repository_name }}</title>

    <style>
      /* Reset margin/padding */
      html, body {
        margin: 0;
        padding: 0;
        background: #f5f5f5; /* พื้นหลัง content */
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      }

      /* ===== Header ===== */
      header.page-header {
        background: #3e403e;
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        padding: 5rem 1rem 2rem 1rem; /* top, sides, bottom */
        width: 100%;
        color: white;
      }

      /* ลบ ::after ของ Cayman */
      header.page-header::after {
        display: none !important;
      }

      /* รูปโปรไฟล์ */
      header.page-header img {
        width: 150px;
        height: 150px;
        object-fit: cover;
        object-position: center 20%;
        border-radius: 50%;
        margin-bottom: 1rem;
        box-shadow: 0 0 10px rgba(0,0,0,0.2);
      }

      /* ข้อความ header */
      header.page-header h1 {
        margin: 0.5rem 0 0.3rem 0;
        font-size: 2rem;
        font-weight: bold;
        color: #ffffff;
        line-height: 1.2;
      }

      header.page-header h2 {
        margin: 0.3rem 0;
        font-size: 1.2rem;
        color: #ffeb3b;
        line-height: 1.3;
      }

      header.page-header h3 {
        margin: 0.3rem 0;
        font-size: 1rem;
        color: #cfcfcf;
        line-height: 1.3;
      }

      /* contact info สีต่าง */
      header.page-header .contact-info {
        color: #ffffff;
        font-weight: bold;
      }

      /* ===== Main content ===== */
      .main-content {
        max-width: 900px;
        margin: 2rem auto;
        padding: 0 1rem;
        box-sizing: border-box;
      }

      /* ===== Responsive ===== */
      @media screen and (max-width: 600px) {
        header.page-header {
          padding: 3rem 1rem 1.5rem 1rem;
        }
        header.page-header img {
          width: 120px;
          height: 120px;
        }
        header.page-header h1 {
          font-size: 1.5rem;
        }
        header.page-header h2 {
          font-size: 1rem;
        }
        header.page-header h3 {
          font-size: 0.9rem;
        }
      }
    </style>
  </head>

  <body>
    <header class="page-header">
      <img src="{{ '/assets/profile.jpg' | relative_url }}" alt="Profile photo" />

      <h1 class="project-name">{{ site.title | default: site.github.repository_name }}</h1>
      <h2 class="project-tagline">{{ site.description | default: site.github.project_tagline }}</h2>
      <h3 class="project-tagline">
        Mail: <span class="contact-info">pichainootor@gmail.com</span> | 
        Phone: <span class="contact-info">095-395-5453</span>
      </h3>
    </header>

    <div class="main-content">
      {{ content }}
    </div>
  </body>
</html>
