<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en-US' }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ site.title | default: site.github.repository_name }}</title>

  <style>
    /* ===== Reset margin/padding ===== */
    html, body {
      margin: 0;
      padding: 0;
      background: #f5f5f5; /* พื้นหลัง content */
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
    }

    /* ===== Header แบบเต็มจอ ===== */
    header.page-header {
      background: #3e403e !important;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      overflow: visible !important;
      padding: 5rem 1rem 2rem 1rem; /* top, sides, bottom */
      width: 100%;
      margin: 0;
      color: white;
    }

    /* ลบ ::after ของ Cayman theme */
    header.page-header::after {
      display: none !important;
    }

    /* ===== รูปโปรไฟล์ ===== */
    header.page-header img {
      width: 150px;
      height: 150px;
      object-fit: cover;
      object-position: center 20%;
      border-radius: 50%;
      margin-top: 5rem;
      margin-bottom: 10px;
      box-shadow: 0 0 8px rgba(0,0,0,0.15);
    }

    /* ===== ข้อความ h1-h3 ===== */
    header.page-header h1 {
      margin: 0.3rem 0;
      line-height: 1.2;
      font-size: 2rem;
      font-weight: bold;
      color: #ffffff; /* ชื่อเด่นที่สุด */
    }

    header.page-header h2 {
      margin: 0.3rem 0;
      line-height: 1.2;
      font-size: 1.2rem;
      color: #ffeb3b; /* tagline สีต่างจาก h1 */
    }

    header.page-header h3 {
      margin: 0.3rem 0;
      line-height: 1.2;
      font-size: 1rem;
      font-weight: normal;
      color: #cfcfcf; /* contact สีเทาอ่อน */
    }

    /* ===== Contact info สีต่าง ===== */
    header.page-header .contact-info {
      color: #ffd700; /* สีทองเด่น */
      font-weight: bold;
    }

    /* ===== Main content ===== */
    .main-content {
      max-width: 900px;   
      margin: 2rem auto;  
      padding: 0 1rem;    
      box-sizing: border-box;
    }

    /* ===== Responsive สำหรับมือถือ ===== */
    @media screen and (max-width: 600px) {
      header.page-header {
        padding: 3rem 1rem 1.5rem 1rem;
      }
      header.page-header img {
        width: 120px;
        height: 120px;
        margin-top: 3rem;
      }
      header.page-header h1 {
        font-size: 1.5rem;
      }
      header.page-header h2 {
        font-size: 1rem;
      }
      header.page-header h3 {
        font-size: 0.9rem;
      }
    }
  </style>
</head>

<body>
  <!-- ===== Header ===== -->
  <header class="page-header">
    <img src="{{ '/assets/profile.jpg' | relative_url }}" alt="Profile photo" />
    
    <h1 class="project-name">{{ site.title | default: site.github.repository_name }}</h1>
    <h2 class="project-tagline">{{ site.description | default: site.github.project_tagline }}</h2>
    <h3 class="project-tagline">
      Mail: <span class="contact-info">pichainootor@gmail.com</span> | 
      Phone: <span class="contact-info">095-395-5453</span>
    </h3>
  </header>

  <!-- ===== Main content ===== -->
  <div class="main-content">
    {{ content }}
  </div>
</body>
</html>
