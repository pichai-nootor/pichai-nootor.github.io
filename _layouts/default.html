<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en-US' }}">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>{{ site.title | default: site.github.repository_name }}</title>

    <!-- ✅ วางตรงนี้ -->
<style>
  /* ทำให้ header สีเทาเต็มพื้นที่ */
  header.page-header {
    background: #919191 !important;
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    overflow: visible !important;
    color: white !important; /* ให้ตัวหนังสือขาวอ่านชัด */
    padding-top: 5rem !important;
    padding-bottom: 3rem !important;
    width: 100vw;  /* กินเต็มหน้าจอแนวนอน */
    margin-left: calc(-50vw + 50%); /* ป้องกันขอบขาวด้านข้าง */
  }

  /* ลบโค้งและเงาของธีม Cayman ที่บัง header */
  .page-header::after {
    display: none !important;
  }

  /* ปรับให้เนื้อหาด้านล่างไม่ชิด */
  .main-content {
    padding-top: 0 !important;
  }
</style>

  </head>

  <body>
    <header class="page-header" role="banner" style="text-align:center;">
      <img 
        src="{{ '/assets/profile.jpg' | relative_url }}" 
        alt="Profile photo" 
        style="width:150px; height:150px; object-fit:cover; object-position:center 20%; margin-top:5rem; border-radius:50%; margin-bottom:10px; box-shadow:0 0 8px rgba(0,0,0,0.15);"
      />
      
      <h1 class="project-name">{{ site.title | default: site.github.repository_name }}</h1>
      <h2 class="project-tagline">{{ site.description | default: site.github.project_tagline }}</h2>
      <h3 class="project-tagline">
        Mail: pichainootor@gmail.com | Phone: 095-395-5453
      </h3>
    </header>

    {{ content }}
  </body>
</html>
